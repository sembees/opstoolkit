services:
  opstoolkit:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: opstoolkit
    # PXE 需要: host 网络 (DHCP 广播) + privileged (mount ISO loop)
    network_mode: host
    privileged: true
    volumes:
      # 持久化数据
      - ./data:/app/backend/data
      - /etc/dnsmasq.d:/etc/dnsmasq.d
      - ./frontend/dist:/app/frontend/dist
      - ./backend/app:/app/backend/app
      # 用例也挂进去。backend/tests 本来是**烤进镜像**的，改完用例必须 docker compose build
      # 才生效 —— 踩过多次（§4-I / §5.41）：容器里跑的还是旧用例，golden 失败被当成回归、
      # 新用例根本没被执行。挂进来之后"改用例 → 直接 pytest"就成立，与 backend/app 同理。
      - ./backend/tests:/app/backend/tests
      # 宿主机侧的 dnsmasq 重载脚本/单元也挂进来（只读）。
      # 为什么：两条"改脚本时最容易忘"的契约（SCRIPT_VERSION >= 应用侧要求、
      # 单元里的 StartLimitIntervalSec=0 / SuccessExitStatus=0 1）在 test_host_reload.py 里
      # 有守卫，但容器里看不到 deploy/host/ ⇒ 会**静默 skip**，等于从未被守卫
      # （外部审查 U6-F6）。挂进来之后容器里也真跑；找不到文件时测试会直接失败而不是跳过。
      - ./deploy/host:/app/deploy/host:ro
      # ★ `.env`（JWT secret + credential_key）**必须挂**（外部审查 U4-F6 的部署侧一半）。
      # 不挂的后果（真机上已确认存在这条路径）：`_write_env` 写的是 BASE_DIR/.env =
      # /app/backend/.env，而那个路径在**容器可写层**里 —— `docker compose restart` 还在，
      # 但 `docker compose up -d`（重建容器）会把它丢掉 / 回退成镜像里 COPY 进去的那份：
      #   · 容器里生成过新 key ⇒ 重建后滚回旧 key ⇒ 用新 key 加密的凭据**永久打不开**；
      #   · 镜像里那份是构建时从宿主机 backend/.env 复制的，两处不一致时
      #     "到底哪把 key 在用"完全靠运气（库里现有 4 条凭据 + 7 个 ZTP 模板存着密文）。
      # 挂上之后：key 文件与仓库/备份在一起、重建容器不丢、容器内外永远看到同一份。
      - ./backend/.env:/app/backend/.env:rw
      # 入口脚本也挂进去：它是"容器是否自起 dnsmasq"的开关，必须与仓库保持一致，
      # 不能依赖镜像里烤进去的那份副本（改它需要重建镜像，而前端阶段重建当前会失败）。
      - ./backend/docker-entrypoint.sh:/docker-entrypoint.sh:ro
      # PXE 文件 (内核 + 固件 + 应答文件)
      - /srv/tftp:/srv/tftp
      - /srv/opstk/pxe-web:/srv/opstk/pxe-web
      # ZTP 的 HTTP 目录。**必须挂**：ZTP 部署会把设备配置同时写到 TFTP 与 HTTP 两个根，
      # 不挂的话那些文件只活在容器的可写层里 —— 宿主机看不到、容器一重建就没了，
      # 而 app/main.py 又只在"启动时目录存在"的前提下才注册 /ztp 静态服务
      # （见 §5.52）。与 pxe-web 同理，挂宿主机目录才是唯一持久的做法。
      - /srv/opstk/ztp-web:/srv/opstk/ztp-web
      - /srv/opstk/iso:/srv/opstk/iso
      - /srv/opstk/mnt:/srv/opstk/mnt
      # 宿主机 dnsmasq 重载握手的状态目录。必须挂：容器无法命令宿主机 systemd
      # （没挂 /run/dbus，也没有 pid: host），只能靠共享文件系统确认
      # "刚写的配置到底有没有被正在跑的 dnsmasq 加载"。不挂的后果实测过 ——
      # 宿主机明明重载成功，容器里 open() 永远 ENOENT，部署报失败。
      - /srv/opstk/state:/srv/opstk/state
      # dnsmasq 的租约文件目录。**ZTP 的「落位认领」要靠它**：设备到货时运维
      # 手里只有落位和规划 IP、没有 MAC，而设备一上电 dnsmasq 就把它的 MAC 记进
      # 租约里 —— 容器读得到这个文件，才能把"上电了但还没认领"的设备列出来，
      # 运维点一下认领即可（不用手抄 MAC）。路径按宿主机原样挂（只读），
      # 换发行版把租约放别处时用环境变量 OPS_DNSMASQ_LEASES 指定即可。
      # 实测本机（dnsmasq 2.85）真实路径是 /var/lib/dnsmasq/dnsmasq.leases。
      - /var/lib/dnsmasq:/var/lib/dnsmasq:ro
    restart: unless-stopped

volumes:
  iso-store:
  mnt-tmp:
