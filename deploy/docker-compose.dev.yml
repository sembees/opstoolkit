# =============================================================================
# OpsToolkit 开发态覆盖层（在应用态 compose 之上叠加"挂源码快速迭代"）
#
# 用法【必须从仓库根目录执行，且必须带 --project-directory .】：
#   docker compose --project-directory . \
#     -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml up -d
#   docker compose --project-directory . \
#     -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml down
#
# 为什么要 --project-directory .：两个 compose 文件里的 ./ 相对路径都按"项目目录"
# 解析；应用态文件期望解析到安装根（线上是 /opt/opstk），开发时解析到仓库根，
# 这样 ./backend/.env、./data、./deploy/... 才指向仓库里的同一套文件。
#
# 叠加后的效果 = 仓库根 docker-compose.yml（今天正在用的开发态）等价的挂源码形态：
#   · 改 backend/app → 容器里立即生效（uvicorn 无 --reload，需 docker compose restart）；
#   · 改 frontend → npm run build 生成 dist 后即生效（后端直接服务 dist）；
#   · 改 backend/tests → 容器里直接 pytest；
#   · deploy/host 挂进容器，host reload 的守卫测试不再静默 skip；
#   · 入口脚本回到 backend/docker-entrypoint.sh（与线上容器同一份）。
# 日常开发也可以继续直接用仓库根的 docker-compose.yml（二者挂载等价，本文件的意义是
# 让"同一份应用态 compose"成为两条形态的公共底座，避免两份 compose 漂移）。
# =============================================================================
services:
  opstoolkit:
    # 开发态沿用既有构建文件（与仓库根 docker-compose.yml 完全同参）
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: opstk-opstoolkit:latest
    container_name: opstoolkit
    # 回到与线上容器相同的入口（backend/docker-entrypoint.sh，端口固定 8000）
    entrypoint: ["/bin/bash", "/docker-entrypoint.sh"]
    volumes:
      # 源码目录挂进容器（应用态刻意不挂的东西，开发态全挂回来）
      - ./backend/app:/app/backend/app
      - ./backend/tests:/app/backend/tests
      - ./frontend/dist:/app/frontend/dist
      # 宿主机 dnsmasq 重载脚本/单元挂进容器（只读）：test_host_reload.py 的守卫
      # 需要容器里能看到 deploy/host/，否则会静默 skip（外部审查 U6-F6）
      - ./deploy/host:/app/deploy/host:ro
      # 入口脚本挂回 backend 那份（开发态与线上容器同源）
      - ./backend/docker-entrypoint.sh:/docker-entrypoint.sh:ro
